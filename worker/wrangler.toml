name = "bilabot-gateway"
main = "src/index.js"
compatibility_date = "2026-07-14"
workers_dev = true

[vars]
PAGE_ORIGIN = "https://xulytiengviet.github.io"
TURNSTILE_SITE_KEY = ""
GOOGLE_CLIENT_ID = ""
# Set GOOGLE_CLIENT_ID to the SAME public OAuth Web Client ID in docs/config.js.
# Google tokens are verified server-side (Google JWKS, aud/iss/exp).
# Set secrets with wrangler: TURNSTILE_SECRET, SESSION_SECRET, TICKET_KEY.
# Do not commit Google client secrets or user tokens.
